name: ACP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  acp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [copilot, droid, gemini, goose, grok, hermes, kilo, kimi, opencode, qwen]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          echo '#!/bin/sh' > tests/belt
          chmod +x tests/belt
          docker build -f tests/Dockerfile -t harness-test .
      - name: Test ${{ matrix.harness }}
        run: docker run --rm harness-test --harness ${{ matrix.harness }} --mode acp
        timeout-minutes: 5
