name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test ./... -count=1 -v

  mock-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build -o harness-test .
      - name: Smoke test mock server
        run: |
          ./harness-test --server &
          sleep 1
          PORT=$(ss -tlnp | grep harness-test | grep -oP ':\K[0-9]+' | head -1)

          curl -sf http://127.0.0.1:$PORT/v1/chat/completions \
            -d '{"model":"t","messages":[{"role":"user","content":"hi"}]}' > /dev/null
          curl -sf http://127.0.0.1:$PORT/v1/responses \
            -d '{"model":"t","input":"hi"}' > /dev/null
          curl -sf http://127.0.0.1:$PORT/v1/messages \
            -H "x-api-key: t" \
            -d '{"model":"t","messages":[{"role":"user","content":"hi"}],"max_tokens":10}' > /dev/null

          COUNT=$(curl -s http://127.0.0.1:$PORT/log/count)
          echo "Requests: $COUNT"
          kill %1

  harness:
    runs-on: ubuntu-latest
    needs: [unit, docker]
    strategy:
      fail-fast: false
      matrix:
        harness:
          - claude
          - codex
          - copilot
          - droid
          - gemini
          - goose
          - grok
          - hermes
          - kilo
          - kimi
          - opencode
          - pi
          - qwen
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          echo '#!/bin/sh' > tests/belt
          chmod +x tests/belt
          docker build -f tests/Dockerfile -t harness-test .
      - name: Test ${{ matrix.harness }} (headless)
        run: docker run --rm harness-test --harness ${{ matrix.harness }} --mode headless
        timeout-minutes: 5

  acp:
    runs-on: ubuntu-latest
    needs: [unit, docker]
    strategy:
      fail-fast: false
      matrix:
        harness: [copilot, droid, gemini, goose, grok, hermes, kilo, kimi, opencode, qwen]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          echo '#!/bin/sh' > tests/belt
          chmod +x tests/belt
          docker build -f tests/Dockerfile -t harness-test .
      - name: Test ${{ matrix.harness }} (ACP)
        run: docker run --rm harness-test --harness ${{ matrix.harness }} --mode acp
        timeout-minutes: 5

  sdk:
    runs-on: ubuntu-latest
    needs: [unit, docker]
    strategy:
      fail-fast: false
      matrix:
        harness: [claude]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          echo '#!/bin/sh' > tests/belt
          chmod +x tests/belt
          docker build -f tests/Dockerfile -t harness-test .
      - name: Test ${{ matrix.harness }} (SDK)
        run: docker run --rm harness-test --harness ${{ matrix.harness }} --mode sdk
        timeout-minutes: 5

  docker:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          echo '#!/bin/sh' > tests/belt
          chmod +x tests/belt
          docker build -f tests/Dockerfile -t harness-test .
      - name: Verify binary
        run: docker run --rm --entrypoint harness-test harness-test --list
