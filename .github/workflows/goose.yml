name: goose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ["headless","acp"]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          echo '#!/bin/sh' > tests/belt
          chmod +x tests/belt
          docker build -f tests/Dockerfile -t harness-test .
      - name: Test ${{ matrix.mode }}
        run: docker run --rm harness-test --harness goose --mode ${{ matrix.mode }}
        timeout-minutes: 5
