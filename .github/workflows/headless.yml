name: Headless

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  headless:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness:
          - claude
          - codex
          - copilot
          - droid
          - gemini
          - goose
          - grok
          - hermes
          - kilo
          - kimi
          - opencode
          - pi
          - qwen
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          echo '#!/bin/sh' > tests/belt
          chmod +x tests/belt
          docker build -f tests/Dockerfile -t harness-test .
      - name: Test ${{ matrix.harness }}
        run: docker run --rm harness-test --harness ${{ matrix.harness }} --mode headless
        timeout-minutes: 5
