name: Nightly

on:
  schedule:
    - cron: '0 4 * * *' # 4 AM UTC daily
  workflow_dispatch: # manual trigger

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: claude
            modes: headless,sdk
          - harness: codex
            modes: headless,sdk
          - harness: copilot
            modes: headless,acp
          - harness: cursor
            modes: headless,interactive
          - harness: droid
            modes: headless,acp
          - harness: gemini
            modes: headless,acp
          - harness: goose
            modes: headless,acp
          - harness: grok
            modes: headless,acp
          - harness: hermes
            modes: headless,acp
          - harness: kilo
            modes: headless,acp
          - harness: kimi
            modes: headless,acp
          - harness: opencode
            modes: headless,acp
          - harness: kiro
            modes: headless,interactive,acp
          - harness: omp
            modes: headless,acp,sdk
          - harness: pi
            modes: headless,sdk
          - harness: qwen
            modes: headless,acp
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          tests/fetch-belt.sh
          docker build -f tests/Dockerfile -t harness-test .

      - name: Test ${{ matrix.harness }}
        id: test
        run: |
          results=""
          extra=""; user=""
          if [ "${{ matrix.harness }}" = "kiro" ]; then extra="--intercept"; user="--user root"; fi
          for mode in $(echo "${{ matrix.modes }}" | tr ',' ' '); do
            # Each mode runs twice: the runner's mock hooks, then the released
            # belt CLI's real hook commands (--hooks belt).
            for hooks in mock belt; do
              echo "=== ${{ matrix.harness }} ($mode, $hooks hooks) ==="
              hookflag=""; [ "$hooks" = belt ] && hookflag="--hooks belt"
              if docker run --rm $user harness-test --harness ${{ matrix.harness }} --mode $mode $hookflag $extra 2>&1 | tee /tmp/out.log; then
                results="${results}${mode}/${hooks}:pass,"
              else
                results="${results}${mode}/${hooks}:fail,"
              fi
              # Extract version from output
              ver=$(grep -oP '→ version: \K.*' /tmp/out.log | head -1)
              if [ -n "$ver" ]; then
                echo "version=$ver" >> $GITHUB_OUTPUT
              fi
            done
          done
          echo "results=$results" >> $GITHUB_OUTPUT
          # Every mode above runs to completion; only now does a failure fail
          # the job, so the summary is complete and the badge is truthful.
          case "$results" in *:fail*) echo "::error::${{ matrix.harness }}: $results"; exit 1;; esac
        timeout-minutes: 20

      - name: Report
        if: always()
        run: |
          echo "### ${{ matrix.harness }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.test.outputs.version || 'unknown' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Results**: ${{ steps.test.outputs.results }}" >> $GITHUB_STEP_SUMMARY
