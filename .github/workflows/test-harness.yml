name: Test Harness (reusable)

on:
  workflow_call:
    inputs:
      harness:
        required: true
        type: string
      modes:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJson(inputs.modes) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          echo '#!/bin/sh' > tests/belt
          chmod +x tests/belt
          docker build -f tests/Dockerfile -t harness-test .
      - name: Test ${{ matrix.mode }}
        # kiro has no BYOK endpoint: it only works through the MITM intercept,
        # which rewrites /etc/hosts and installs a CA, so it runs as root.
        run: docker run --rm ${{ inputs.harness == 'kiro' && '--user root' || '' }} harness-test --harness ${{ inputs.harness }} --mode ${{ matrix.mode }} ${{ inputs.harness == 'kiro' && '--intercept' || '' }}
        timeout-minutes: 5
