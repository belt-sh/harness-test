name: Test Harness (reusable)

on:
  workflow_call:
    inputs:
      harness:
        required: true
        type: string
      modes:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJson(inputs.modes) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        # tests/belt is the released belt CLI from dist.inference.sh; the
        # --hooks belt run installs its real hook commands through the package.
        run: |
          tests/fetch-belt.sh
          docker build -f tests/Dockerfile -t harness-test .
      - name: Test ${{ matrix.mode }} (mock hooks)
        # kiro has no BYOK endpoint: it only works through the MITM intercept,
        # which rewrites /etc/hosts and installs a CA, so it runs as root.
        run: docker run --rm ${{ inputs.harness == 'kiro' && '--user root' || '' }} harness-test --harness ${{ inputs.harness }} --mode ${{ matrix.mode }} ${{ inputs.harness == 'kiro' && '--intercept' || '' }}
        timeout-minutes: 5
      - name: Test ${{ matrix.mode }} (belt hooks)
        run: docker run --rm ${{ inputs.harness == 'kiro' && '--user root' || '' }} harness-test --harness ${{ inputs.harness }} --mode ${{ matrix.mode }} --hooks belt ${{ inputs.harness == 'kiro' && '--intercept' || '' }}
        timeout-minutes: 5
